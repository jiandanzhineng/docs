<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="980" height="520" rx="16" fill="#f7fbff"/>
  <text x="36" y="48" font-size="26" font-weight="700" fill="#1a237e">Push-up Detection</text>
  <text x="36" y="80" font-size="26" font-weight="700" fill="#1a237e">Training Flow</text>
  <circle cx="130" cy="230" r="62" fill="#ffffff" stroke="#26c6da" stroke-width="3"/>
  <text x="130" y="224" text-anchor="middle" font-size="14" fill="#16324f">Start</text>
  <text x="130" y="244" text-anchor="middle" font-size="14" fill="#16324f">and lock</text>
  <circle cx="310" cy="230" r="62" fill="#ffffff" stroke="#26c6da" stroke-width="3"/>
  <text x="310" y="224" text-anchor="middle" font-size="14" fill="#16324f">QTZ keeps</text>
  <text x="310" y="244" text-anchor="middle" font-size="14" fill="#16324f">measuring</text>
  <circle cx="490" cy="230" r="68" fill="#ffffff" stroke="#26c6da" stroke-width="3"/>
  <text x="490" y="218" text-anchor="middle" font-size="13" fill="#16324f">Under 15 cm</text>
  <text x="490" y="238" text-anchor="middle" font-size="13" fill="#16324f">counts as Down</text>
  <circle cx="680" cy="230" r="72" fill="#ffffff" stroke="#26c6da" stroke-width="3"/>
  <text x="680" y="214" text-anchor="middle" font-size="13" fill="#16324f">Over 35 cm</text>
  <text x="680" y="234" text-anchor="middle" font-size="13" fill="#16324f">counts as Up</text>
  <text x="680" y="252" text-anchor="middle" font-size="13" fill="#16324f">count +1</text>
  <circle cx="870" cy="230" r="62" fill="#ffffff" stroke="#26c6da" stroke-width="3"/>
  <text x="870" y="224" text-anchor="middle" font-size="14" fill="#16324f">End and</text>
  <text x="870" y="244" text-anchor="middle" font-size="14" fill="#16324f">unlock</text>
  <line x1="192" y1="230" x2="248" y2="230" stroke="#26c6da" stroke-width="3" marker-end="url(#a)"/>
  <line x1="372" y1="230" x2="422" y2="230" stroke="#26c6da" stroke-width="3" marker-end="url(#a)"/>
  <line x1="558" y1="230" x2="608" y2="230" stroke="#26c6da" stroke-width="3" marker-end="url(#a)"/>
  <line x1="752" y1="230" x2="808" y2="230" stroke="#26c6da" stroke-width="3" marker-end="url(#a)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#26c6da"/>
    </marker>
  </defs>
  <path d="M310 168 C310 120, 490 120, 490 162" fill="none" stroke="#ff7043" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="400" y="112" text-anchor="middle" font-size="13" fill="#e64a19">No motion 15 s</text>
  <circle cx="400" cy="78" r="28" fill="#ff7043"/>
  <text x="400" y="74" text-anchor="middle" font-size="11" fill="#ffffff">Penalty</text>
  <text x="400" y="88" text-anchor="middle" font-size="11" fill="#ffffff">shock</text>
  <path d="M680 158 C680 110, 820 110, 820 150" fill="none" stroke="#7e57c2" stroke-width="2.5"/>
  <text x="760" y="104" text-anchor="middle" font-size="13" fill="#5e35b1">3 in a row</text>
  <circle cx="820" cy="78" r="28" fill="#7e57c2"/>
  <text x="820" y="74" text-anchor="middle" font-size="11" fill="#ffffff">Reward</text>
  <text x="820" y="88" text-anchor="middle" font-size="11" fill="#ffffff">vibe</text>
  <text x="760" y="214" text-anchor="middle" font-size="12" fill="#00838f">30 reps or 15 min</text>
  <path d="M130 292 C130 360, 490 360, 490 298" fill="none" stroke="#26c6da" stroke-width="3" marker-end="url(#a)"/>
  <text x="300" y="352" text-anchor="middle" font-size="13" fill="#00838f">Loop</text>
  <rect x="36" y="420" width="908" height="72" rx="36" fill="#ffffff"/>
  <text x="56" y="450" font-size="13" fill="#16324f">QTZ distance sensor: measures height, judges down / up</text>
  <text x="56" y="472" font-size="13" fill="#16324f">ZIDONGSUO auto lock: lock at start, unlock at end</text>
  <text x="520" y="450" font-size="13" fill="#16324f">CUNZHI01 edging device:</text>
  <text x="520" y="472" font-size="13" fill="#16324f">vibe reward + shock penalty</text>
</svg>
