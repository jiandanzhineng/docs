<svg xmlns="http://www.w3.org/2000/svg" width="860" height="780" viewBox="0 0 860 780" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <rect width="860" height="780" rx="16" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="430" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#202124">喝水/憋尿解锁玩法 · 核心流程</text>

  <rect x="290" y="58" width="280" height="48" rx="12" fill="#e6f4ea" stroke="#34a853"/>
  <text x="430" y="87" text-anchor="middle" font-size="16" fill="#1e7d34">开始游戏 · 自动上锁</text>
  <rect x="620" y="58" width="210" height="48" rx="10" fill="#f1f3f4" stroke="#80868b"/>
  <text x="725" y="78" text-anchor="middle" font-size="13" fill="#3c4043">自动锁（可选）</text>
  <text x="725" y="96" text-anchor="middle" font-size="12" fill="#5f6368">开始锁定、结束解锁</text>
  <line x1="570" y1="82" x2="620" y2="82" stroke="#9aa0a6" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>

  <line x1="430" y1="106" x2="430" y2="132" stroke="#5f6368" marker-end="url(#arr)"/>

  <rect x="290" y="134" width="280" height="52" rx="12" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="430" y="156" text-anchor="middle" font-size="15" fill="#174ea6">电子秤记录起始重量</text>
  <text x="430" y="175" text-anchor="middle" font-size="12" fill="#1967d2">喝水取最重值 / 排泄取最轻值</text>
  <rect x="30" y="134" width="210" height="52" rx="10" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="135" y="156" text-anchor="middle" font-size="13" fill="#174ea6">电子秤 DZC01（必需）</text>
  <text x="135" y="174" text-anchor="middle" font-size="12" fill="#1967d2">水瓶或容器一直放在秤上</text>
  <line x1="240" y1="160" x2="290" y2="160" stroke="#1a73e8" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>

  <line x1="430" y1="186" x2="430" y2="212" stroke="#5f6368" marker-end="url(#arr)"/>

  <rect x="250" y="214" width="360" height="88" rx="12" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="430" y="240" text-anchor="middle" font-size="16" fill="#7627bb">运行监测</text>
  <text x="430" y="262" text-anchor="middle" font-size="13" fill="#7627bb">喝水：持续变轻　　排泄：持续变重</text>
  <text x="430" y="284" text-anchor="middle" font-size="13" fill="#7627bb">可选：保持提肛 + 踮脚</text>
  <rect x="620" y="214" width="210" height="88" rx="10" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="725" y="238" text-anchor="middle" font-size="13" fill="#7627bb">寸止 / QTZ（可选）</text>
  <text x="725" y="258" text-anchor="middle" font-size="12" fill="#8a3cc8">提肛气压不足会惩罚</text>
  <text x="725" y="276" text-anchor="middle" font-size="12" fill="#8a3cc8">脚跟落地 / 未踮脚会惩罚</text>
  <text x="725" y="294" text-anchor="middle" font-size="12" fill="#8a3cc8">随机震动干扰</text>
  <line x1="610" y1="258" x2="620" y2="258" stroke="#9334e6" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>

  <line x1="430" y1="302" x2="430" y2="328" stroke="#5f6368" marker-end="url(#arr)"/>

  <polygon points="430,332 560,388 430,444 300,388" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="430" y="384" text-anchor="middle" font-size="15" fill="#a06a00">姿态失败或停滞？</text>
  <text x="430" y="404" text-anchor="middle" font-size="12" fill="#a06a00">窗口内无有效重量变化</text>

  <text x="248" y="380" text-anchor="end" font-size="13" fill="#a50e0e">是</text>
  <line x1="300" y1="388" x2="210" y2="388" stroke="#5f6368" marker-end="url(#arr)"/>
  <rect x="40" y="362" width="170" height="52" rx="12" fill="#fce8e6" stroke="#ea4335"/>
  <text x="125" y="384" text-anchor="middle" font-size="15" fill="#a50e0e">电击惩罚</text>
  <text x="125" y="402" text-anchor="middle" font-size="12" fill="#a50e0e">随后进入冷却</text>
  <line x1="125" y1="414" x2="125" y2="458" stroke="#5f6368" marker-end="url(#arr)"/>
  <rect x="40" y="460" width="170" height="48" rx="12" fill="#fff3e0" stroke="#f57c00"/>
  <text x="125" y="489" text-anchor="middle" font-size="14" fill="#e65100">冷却后重置监测</text>
  <path d="M125 508 C125 548 250 258 250 258" fill="none" stroke="#9aa0a6" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>

  <text x="500" y="456" font-size="13" fill="#1e7d34">否</text>
  <line x1="430" y1="444" x2="430" y2="478" stroke="#5f6368" marker-end="url(#arr)"/>

  <polygon points="430,482 545,530 430,578 315,530" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="430" y="526" text-anchor="middle" font-size="15" fill="#a06a00">达标或超时？</text>
  <text x="430" y="546" text-anchor="middle" font-size="12" fill="#a06a00">目标克数 / 最长时长</text>

  <text x="288" y="522" text-anchor="end" font-size="13" fill="#1e7d34">否</text>
  <path d="M315 530 C250 530 250 302 250 302" fill="none" stroke="#9aa0a6" stroke-dasharray="5 4" marker-end="url(#arrDash)"/>

  <text x="560" y="522" font-size="13" fill="#1e7d34">是</text>
  <line x1="545" y1="530" x2="620" y2="530" stroke="#5f6368" marker-end="url(#arr)"/>
  <rect x="620" y="506" width="210" height="48" rx="12" fill="#e6f4ea" stroke="#34a853"/>
  <text x="725" y="535" text-anchor="middle" font-size="15" fill="#1e7d34">解锁并结束</text>

  <rect x="250" y="620" width="360" height="48" rx="12" fill="#eceff1" stroke="#607d8b"/>
  <text x="430" y="649" text-anchor="middle" font-size="15" fill="#37474f">显示进度、惩罚次数与日志</text>
  <line x1="725" y1="554" x2="725" y2="644" stroke="#5f6368"/>
  <line x1="725" y1="644" x2="610" y2="644" stroke="#5f6368" marker-end="url(#arr)"/>

  <text x="430" y="710" text-anchor="middle" font-size="13" fill="#5f6368">里程碑 25% / 50% / 75% / 90% 会语音播报；冷却结束后清空重量历史再继续监测</text>
  <text x="430" y="734" text-anchor="middle" font-size="13" fill="#5f6368">未映射的可选设备不会参与判定，只接电子秤也能玩纯喝水 / 排泄解锁</text>
</svg>
